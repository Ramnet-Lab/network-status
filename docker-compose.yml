# Linux host ON the monitored LAN — the reliable deployment.
# host networking lets the container ping 10.2.60.x and reach the radios
# exactly as a process on the host would. Run:  docker compose up -d
services:
  network-status:
    build: .
    container_name: network-status
    restart: unless-stopped
    network_mode: host          # see 10.2.60.x directly (Linux hosts only)
    cap_add:
      - NET_RAW                 # ICMP ping from inside the container
    environment:
      PORT: "8766"
      # POWER_GATEWAYS: "10.2.60.215"   # comma-separated; radio that reports battery
      # RADIO_USER: "factory"
      # RADIO_PASSWORD: "password"
    volumes:
      - ./data:/data            # devices.json persists here
